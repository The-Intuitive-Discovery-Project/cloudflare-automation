name: Validate PowerShell Deploy Manager

on:
  pull_request:
    paths:
      - 'powershell/**'
      - '.github/workflows/validate-deploy-manager.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Parse all PowerShell without executing it
        shell: pwsh
        run: |
          $files = Get-ChildItem './powershell' -Filter '*.ps1' -File
          if (-not $files) { throw 'No PowerShell files were found.' }
          foreach ($file in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell parse errors in $($file.Name)"
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            Write-Host "PowerShell syntax valid: $($file.Name)"
          }

      - name: Validate project reference JSON and fail-closed registry
        shell: pwsh
        run: |
          $cfg = Get-Content './powershell/projects.reference.json' -Raw | ConvertFrom-Json
          if (-not $cfg.projects -or $cfg.projects.Count -lt 1) { throw 'No projects are registered.' }
          $duplicates = $cfg.projects | Group-Object name | Where-Object Count -gt 1
          if ($duplicates) { throw "Duplicate project names found: $($duplicates.Name -join ', ')" }

          foreach ($p in $cfg.projects) {
            foreach ($field in @('name','repo','cloudflareType','configPath','d1Databases','status','deployReady','credentialSync','enabled','protected')) {
              if (-not ($p.PSObject.Properties.Name -contains $field)) { throw "Project '$($p.name)' is missing required field '$field'." }
            }
            if (-not $p.deployReady) {
              if ($p.enabled) { throw "Unverified project '$($p.name)' must remain disabled." }
              if ($p.credentialSync) { throw "Unverified project '$($p.name)' must not receive the shared Cloudflare token." }
            }
            if ($p.cloudflareType -eq 'worker' -and $p.deployReady -and [string]::IsNullOrWhiteSpace([string]$p.configPath)) {
              throw "Deploy-ready Worker '$($p.name)' is missing configPath."
            }
            if ($p.d1Databases -isnot [System.Array]) {
              throw "Project '$($p.name)' must define d1Databases as an array."
            }
          }

          $admin = @($cfg.projects | Where-Object name -eq 'central-admin')
          if ($admin.Count -ne 1) { throw 'Central Admin must be registered exactly once.' }
          if ($admin[0].enabled) { throw 'Central Admin must remain deployment-disabled until complete All-in-One backup coverage is verified.' }
          if (-not $admin[0].protected) { throw 'Central Admin must remain protected.' }
          Write-Host "Registered projects: $($cfg.projects.Count)"

      - name: Safety, bootstrap, and read-only status assertions
        shell: pwsh
        run: |
          $text = Get-Content './powershell/TinyThorDeploy.ps1' -Raw
          foreach ($required in @('Backup-Project','d1 export','Get-FileHash','--dry-run','deployReady','credentialSync','protected','ConvertFrom-SecureString','gh secret set','RefreshRegistry')) {
            if ($text -notmatch [regex]::Escape($required)) { throw "Missing safety control: $required" }
          }

          $bootstrap = Get-Content './powershell/Bootstrap.ps1' -Raw
          foreach ($required in @('FullSetup','Microsoft.PowerShell','OpenJS.NodeJS.LTS','GitHub.cli','gh auth login','SyncGitHubSecrets','DiscoverLocal','Audit','ExistingLocalSetup')) {
            if ($bootstrap -notmatch [regex]::Escape($required)) { throw "Bootstrap is missing prerequisite/full-setup control: $required" }
          }

          if (-not (Test-Path './powershell/START-HERE.bat')) { throw 'START-HERE.bat is missing.' }
          $launcher = Get-Content './powershell/START-HERE.bat' -Raw
          if ($launcher -notmatch [regex]::Escape('-FullSetup')) { throw 'START-HERE.bat does not invoke FullSetup.' }
          if ($launcher -match 'CLOUDFLARE_API_TOKEN|CLOUDFLARE_DEPLOY_TOKEN') { throw 'START-HERE.bat must never contain a Cloudflare token value or token variable.' }

          if (-not (Test-Path './powershell/Check-Status.ps1')) { throw 'Check-Status.ps1 is missing.' }
          if (-not (Test-Path './powershell/CHECK-STATUS.bat')) { throw 'CHECK-STATUS.bat is missing.' }
          $status = Get-Content './powershell/Check-Status.ps1' -Raw
          foreach ($required in @('wrangler@latest whoami','gh secret list','Encrypted local Cloudflare token','No production deployment')) {
            if ($status -notmatch [regex]::Escape($required)) { throw "Status checker is missing expected read-only check: $required" }
          }
          if ($status -match 'gh\s+secret\s+set') { throw 'Status checker must never write GitHub secrets.' }
          if ($status -match 'wrangler@latest\s+deploy|wrangler\s+deploy') { throw 'Status checker must never deploy a Worker.' }
          $statusLauncher = Get-Content './powershell/CHECK-STATUS.bat' -Raw
          if ($statusLauncher -notmatch [regex]::Escape('Check-Status.ps1')) { throw 'CHECK-STATUS.bat does not invoke Check-Status.ps1.' }

          Write-Host 'Required safety, bootstrap, and read-only status controls are present.'
