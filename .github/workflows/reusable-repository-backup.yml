name: Reusable Repository Backup

on:
  workflow_call:
    inputs:
      artifact_prefix:
        description: Prefix used for the backup artifact and files
        required: true
        type: string
      retention_days:
        description: GitHub artifact retention days
        required: false
        default: 15
        type: number

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build verified repository backup
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune
          stamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          mkdir -p repository-backup

          bundle="repository-backup/${{ inputs.artifact_prefix }}-${stamp}.bundle"
          tree="repository-backup/${{ inputs.artifact_prefix }}-${stamp}-working-tree.tar.gz"
          manifest="repository-backup/${{ inputs.artifact_prefix }}-${stamp}-manifest.txt"
          checksums="repository-backup/${{ inputs.artifact_prefix }}-${stamp}-SHA256SUMS.txt"

          git bundle create "$bundle" --all
          git bundle verify "$bundle"

          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./backups' \
            --exclude='./repository-backup' \
            -czf "$tree" .

          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Created UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Default checkout SHA: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Bundle contains all fetched branches/tags/history."
            echo "Working-tree archive contains the current checked-out source and committed assets."
          } > "$manifest"

          sha256sum "$bundle" "$tree" "$manifest" > "$checksums"
          test -s "$bundle"
          test -s "$tree"
          test -s "$checksums"

          echo "BACKUP_STAMP=$stamp" >> "$GITHUB_ENV"

      - name: Upload verified repository backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-source-${{ env.BACKUP_STAMP }}
          path: repository-backup/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
