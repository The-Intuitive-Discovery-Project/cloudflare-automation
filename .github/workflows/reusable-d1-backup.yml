name: Reusable Cloudflare D1 Backup

on:
  workflow_call:
    inputs:
      database_name:
        description: Cloudflare D1 database name
        required: true
        type: string
      artifact_prefix:
        description: Artifact/file prefix
        required: true
        type: string
      retention_days:
        description: GitHub artifact retention days
        required: false
        default: 15
        type: number
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Export D1 database
        shell: bash
        run: |
          mkdir -p d1-backups
          stamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          file="d1-backups/${{ inputs.artifact_prefix }}-${stamp}.sql"
          npx --yes wrangler d1 export "${{ inputs.database_name }}" --remote --skip-confirmation --output="$file"
          test -s "$file"
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"
          echo "BACKUP_STAMP=$stamp" >> "$GITHUB_ENV"

      - name: Verify backup
        shell: bash
        run: |
          ls -lh "$BACKUP_FILE"
          sha256sum "$BACKUP_FILE"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-${{ env.BACKUP_STAMP }}
          path: ${{ env.BACKUP_FILE }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
